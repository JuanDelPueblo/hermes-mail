[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-mail"
version = "0.2.0"
description = "IMAP/OAuth mail data provider: an index daemon, a CLI, an event dispatcher and an optional MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "JuanDelPueblo" }]
# The daemon, the CLI and the dispatcher use only the standard library.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/JuanDelPueblo/uni-mail"

[project.scripts]
uni-mail = "uni_mail.cli:main"
uni-maild = "uni_mail.server:main"
uni-mail-mcp = "uni_mail.mcp_server:main"

[tool.setuptools]
packages = ["uni_mail", "uni_mail.dispatch"]
