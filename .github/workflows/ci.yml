name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  vm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#vm-test

  hermes-plugin:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the Hermes release that runs the plugin.
      HERMES_REF: v2026.9.24
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the plugin package
        run: nix build -o plugin .#hermes-mail-plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      # Hermes does not build wheels, so run it from a synced checkout.
      - name: Validate the plugin with Hermes
        working-directory: hermes
        run: |
          uv sync --python 3.12
          export HERMES_HOME="$(mktemp -d)"
          plugin="$(readlink -f ../plugin)"
          uv run --no-sync hermes plugins validate "$plugin"
          uv run --no-sync hermes plugins doctor "$plugin" --ci
