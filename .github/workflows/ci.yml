name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --no-cache --select E,F,W,B --ignore E501 --target-version py314 .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run the test suite without optional packages
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Install the package with the MCP extra
        run: |
          python -m pip install --quiet ".[mcp]"
          uni-mail --help > /dev/null
          uni-maild --help > /dev/null
          uni-mail-mcp --help > /dev/null
      - name: Run the MCP tests
        run: python -W error::ResourceWarning -m unittest tests.test_mcp -v
      - name: Check that a plain install works without the MCP extra
        env:
          UNI_MAIL_TEST_INSTALL: "1"
        run: |
          python -m pip install --quiet uv
          python -m unittest tests.test_packaging -v
