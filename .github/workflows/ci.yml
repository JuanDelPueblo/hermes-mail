name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --no-cache --select E,F,W,B --ignore E501 --target-version py312 .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run the test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check the pip package
        run: |
          python -m pip install --quiet .
          hermes-mail --help > /dev/null
          hermes-maild --help > /dev/null

  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_plugin -v

  hermes-plugin:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the Hermes release that runs the plugin.
      HERMES_REF: v2026.9.24
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin directory
        run: scripts/build-plugin.sh
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      # Hermes does not build wheels, so run it from a synced checkout.
      - name: Validate the plugin with Hermes
        working-directory: hermes
        run: |
          uv sync --python 3.12
          export HERMES_HOME="$(mktemp -d)"
          plugin="$(readlink -f ../dist/hermes-mail-plugin)"
          uv run --no-sync hermes plugins validate "$plugin"
          uv run --no-sync hermes plugins doctor "$plugin" --ci
