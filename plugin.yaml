name: hermes-mail
version: 0.1.0
description: "Read, search and manage recent IMAP mail through hermes-maild, and triage new mail into chat notifications."
author: JuanDelPueblo
license: MIT
homepage: https://github.com/JuanDelPueblo/hermes-mail
tags: [mail, imap, email, notifications]
requires_hermes: ">=0.21"
platforms:
  - linux
provides_tools:
  - mail_status
  - mail_list
  - mail_search
  - mail_show
  - mail_attachments
  - mail_export_attachment
  - mail_mark_read
  - mail_mark_unread
  - mail_archive
  - mail_triage_log
config_schema:
  socket:
    type: str
    default: ""
    description: "Path of the hermes-maild socket. Empty means $HERMES_MAIL_SOCKET, then /run/hermes-mail/mail.sock."
  notify:
    type: dict
    default: {}
    label: "Notifications"
    description: "Notifications for each account, keyed by the account name. An entry replaces the base notifications of that account. Keys: mode (triage, all or none), target, policy, mark_read_silent and task_command (a list of words). The Mail tab of the dashboard edits this setting."
  triage_provider:
    type: str
    default: ""
    label: "Triage provider"
    description: "The provider of the triage call. Empty means auxiliary.hermes_mail_triage. Another value needs plugins.entries.hermes-mail.llm.allow_provider_override."
  triage_model:
    type: str
    default: ""
    label: "Triage model"
    description: "The model of the triage call. Empty means auxiliary.hermes_mail_triage. Another value needs plugins.entries.hermes-mail.llm.allow_model_override."
